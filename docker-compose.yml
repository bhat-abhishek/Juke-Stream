version: "3.9"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: music_streaming
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      MONGO_URI: mongodb://mongodb:27017/music_streaming
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      NODE_ENV: production
    depends_on:
      - mongodb

volumes:
  mongo_data:
